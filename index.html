<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioCase / БиоКейс — научный форум биологических кейсов</title>
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F4F9F6;
    --bg-soft-2:#EAF3ED;
    --primary:#15803D;
    --primary-dark:#0F5E2C;
    --primary-light:#DCFCE7;
    --accent:#0D9488;
    --accent-light:#CCFBF1;
    --text:#1E293B;
    --text-muted:#64748B;
    --border:#E2E8F0;
    --border-strong:#CBD5E1;
    --danger:#DC2626;
    --warning:#D97706;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 4px 12px rgba(15,23,42,.06);
    --shadow-lg:0 10px 30px rgba(15,23,42,.1);
    --radius:12px;
    --radius-sm:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg-soft);
    color:var(--text);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--primary);text-decoration:none}
  a:hover{color:var(--primary-dark)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

  /* ---------- HEADER ---------- */
  .header{
    background:var(--bg);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:50;
    overflow:hidden;
  }
  .header-inner{
    max-width:1240px;margin:0 auto;
    padding:18px 24px;
    display:flex;align-items:center;gap:24px;
    position:relative;
  }
  .header-bg{
    position:absolute;inset:0;
    opacity:.55;pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='110' viewBox='0 0 1240 110'><g fill='none' stroke='%2315803D' stroke-width='1.2' opacity='.35'><path d='M0 55 Q 30 10 60 55 T 120 55 T 180 55 T 240 55 T 300 55 T 360 55 T 420 55 T 480 55 T 540 55 T 600 55 T 660 55 T 720 55 T 780 55 T 840 55 T 900 55 T 960 55 T 1020 55 T 1080 55 T 1140 55 T 1200 55 T 1260 55'/><path d='M0 55 Q 30 100 60 55 T 120 55 T 180 55 T 240 55 T 300 55 T 360 55 T 420 55 T 480 55 T 540 55 T 600 55 T 660 55 T 720 55 T 780 55 T 840 55 T 900 55 T 960 55 T 1020 55 T 1080 55 T 1140 55 T 1200 55 T 1260 55'/><g stroke-width='.8' opacity='.5'><line x1='30' y1='33' x2='30' y2='77'/><line x1='90' y1='33' x2='90' y2='77'/><line x1='150' y1='33' x2='150' y2='77'/><line x1='210' y1='33' x2='210' y2='77'/><line x1='270' y1='33' x2='270' y2='77'/><line x1='330' y1='33' x2='330' y2='77'/><line x1='390' y1='33' x2='390' y2='77'/><line x1='450' y1='33' x2='450' y2='77'/><line x1='510' y1='33' x2='510' y2='77'/><line x1='570' y1='33' x2='570' y2='77'/><line x1='630' y1='33' x2='630' y2='77'/><line x1='690' y1='33' x2='690' y2='77'/><line x1='750' y1='33' x2='750' y2='77'/><line x1='810' y1='33' x2='810' y2='77'/><line x1='870' y1='33' x2='870' y2='77'/><line x1='930' y1='33' x2='930' y2='77'/><line x1='990' y1='33' x2='990' y2='77'/><line x1='1050' y1='33' x2='1050' y2='77'/><line x1='1110' y1='33' x2='1110' y2='77'/><line x1='1170' y1='33' x2='1170' y2='77'/></g></g><g fill='none' stroke='%230D9488' stroke-width='1' opacity='.25' transform='translate(0 0)'><circle cx='1150' cy='55' r='22'/><circle cx='1150' cy='55' r='10'/><line x1='1128' y1='55' x2='1100' y2='30'/><line x1='1172' y1='55' x2='1200' y2='80'/><line x1='1150' y1='33' x2='1150' y2='5'/><circle cx='1100' cy='30' r='5'/><circle cx='1200' cy='80' r='5'/><circle cx='1150' cy='5' r='5'/></g></svg>");
    background-repeat:no-repeat;
    background-size:cover;
  }
  .logo{
    display:flex;align-items:center;gap:10px;
    font-weight:700;font-size:20px;color:var(--primary);
    position:relative;z-index:2;cursor:pointer;
  }
  .logo svg{width:32px;height:32px}
  .logo span.sub{font-weight:500;color:var(--text-muted);font-size:13px;margin-left:2px}
  .nav{
    display:flex;gap:4px;position:relative;z-index:2;
    margin-left:12px;
  }
  .nav-btn{
    padding:8px 14px;border-radius:8px;
    font-size:14px;font-weight:500;color:var(--text);
    transition:all .15s;
  }
  .nav-btn:hover{background:var(--bg-soft);color:var(--primary)}
  .nav-btn.active{background:var(--primary-light);color:var(--primary-dark)}
  .header-actions{
    margin-left:auto;display:flex;gap:10px;align-items:center;
    position:relative;z-index:2;
  }
  .btn{
    padding:9px 16px;border-radius:8px;
    font-size:14px;font-weight:600;
    transition:all .15s;
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid transparent;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);color:#fff}
  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:var(--bg-soft);border-color:var(--border-strong)}
  .btn-soft{background:var(--primary-light);color:var(--primary-dark)}
  .btn-soft:hover{background:#C6F0D3}
  .btn-sm{padding:6px 10px;font-size:13px}
  .user-chip{
    display:flex;align-items:center;gap:8px;
    padding:4px 10px 4px 4px;border-radius:999px;
    background:var(--bg-soft);cursor:pointer;
    transition:all .15s;
  }
  .user-chip:hover{background:var(--bg-soft-2)}
  .avatar{
    width:32px;height:32px;border-radius:50%;
    background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;
    flex-shrink:0;
  }
  .avatar.lg{width:80px;height:80px;font-size:28px}
  .avatar.md{width:40px;height:40px;font-size:15px}
  .avatar.org{background:var(--accent)}

  /* ---------- LAYOUT ---------- */
  .container{max-width:1240px;margin:0 auto;padding:28px 24px}
  .page-title{
    font-size:26px;font-weight:700;color:var(--text);
    margin-bottom:6px;letter-spacing:-.01em;
  }
  .page-sub{color:var(--text-muted);margin-bottom:24px;font-size:15px}

  /* ---------- CATEGORY FILTERS ---------- */
  .cat-bar{
    display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
    margin-bottom:20px;
  }
  .cat-card{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;
    cursor:pointer;transition:all .2s;
    display:flex;flex-direction:column;gap:8px;
    position:relative;overflow:hidden;
  }
  .cat-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
  .cat-card.active{
    border-color:var(--primary);
    background:linear-gradient(180deg,#fff 0%,var(--primary-light) 100%);
    box-shadow:var(--shadow);
  }
  .cat-icon{
    width:36px;height:36px;border-radius:10px;
    background:var(--bg-soft);
    display:flex;align-items:center;justify-content:center;
    color:var(--primary);
  }
  .cat-card.active .cat-icon{background:var(--primary);color:#fff}
  .cat-name{font-weight:600;font-size:14px;color:var(--text)}
  .cat-count{font-size:12px;color:var(--text-muted)}
  .cat-card.active .cat-count{color:var(--primary-dark);font-weight:600}

  /* ---------- DESCRIPTION STRIP ---------- */
  .desc-strip{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 20px;
    margin-bottom:20px;
    display:flex;align-items:center;gap:16px;
  }
  .desc-strip .desc-text{flex:1;font-size:14px;color:var(--text)}
  .desc-strip .desc-text strong{color:var(--primary-dark)}
  .desc-strip .desc-count{
    background:var(--primary-light);color:var(--primary-dark);
    padding:6px 12px;border-radius:999px;
    font-weight:600;font-size:13px;white-space:nowrap;
  }

  /* ---------- FILTERS ROW ---------- */
  .filters-row{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-bottom:20px;
  }
  .chip{
    padding:6px 12px;border-radius:999px;
    background:var(--bg);border:1px solid var(--border);
    font-size:13px;color:var(--text);cursor:pointer;
    transition:all .15s;
  }
  .chip:hover{border-color:var(--primary)}
  .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .filters-label{font-size:13px;color:var(--text-muted);margin-right:4px}

  /* ---------- TASK CARDS ---------- */
  .task-list{display:flex;flex-direction:column;gap:12px}
  .task-card{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px 20px;
    cursor:pointer;transition:all .2s;
  }
  .task-card:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px)}
  .task-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .tag{
    padding:3px 10px;border-radius:999px;
    font-size:12px;font-weight:600;
    background:var(--accent-light);color:var(--accent);
  }
  .tag.cat{background:var(--primary-light);color:var(--primary-dark)}
  .tag.level-basic{background:#FEF3C7;color:#92400E}
  .tag.level-adv{background:#FFEDD5;color:#9A3412}
  .tag.level-rnd{background:#FCE7F3;color:#9D174D}
  .tag.status-open{background:#DCFCE7;color:#166534}
  .tag.status-solved{background:#DBEAFE;color:#1E40AF}
  .task-title{
    font-size:17px;font-weight:600;color:var(--text);
    margin-bottom:6px;line-height:1.35;
  }
  .task-meta{
    display:flex;gap:16px;font-size:13px;color:var(--text-muted);
    flex-wrap:wrap;
  }
  .task-meta span{display:inline-flex;align-items:center;gap:5px}
  .task-preview{
    margin-top:10px;font-size:14px;color:var(--text-muted);
    line-height:1.5;
  }

  /* ---------- TASK PAGE ---------- */
  .task-page{display:grid;grid-template-columns:1fr 320px;gap:24px}
  @media(max-width:960px){.task-page{grid-template-columns:1fr}}
  .task-main{min-width:0}
  .task-sticky{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:22px;
    margin-bottom:20px;
    border-left:4px solid var(--primary);
  }
  .task-sticky h1{
    font-size:22px;font-weight:700;margin-bottom:12px;line-height:1.3;
  }
  .task-body{
    font-size:15px;line-height:1.7;color:var(--text);
  }
  .task-body p{margin-bottom:10px}
  .task-body b,.task-body strong{font-weight:700}
  .task-body i,.task-body em{font-style:italic}
  .task-body u{text-decoration:underline}
  .task-body sub{font-size:.75em;vertical-align:sub}
  .task-body sup{font-size:.75em;vertical-align:super}
  .task-body blockquote{
    border-left:3px solid var(--primary);
    background:var(--bg-soft);
    padding:10px 14px;margin:10px 0;
    border-radius:0 8px 8px 0;
    color:var(--text);
  }
  .task-body code,.task-body pre{
    font-family:"SF Mono",Monaco,Consolas,monospace;
    background:var(--bg-soft-2);
    padding:2px 6px;border-radius:4px;
    font-size:.92em;color:var(--primary-dark);
  }
  .task-body pre{
    display:block;padding:12px 14px;margin:10px 0;
    overflow-x:auto;white-space:pre-wrap;
  }
  .task-body ul{margin:8px 0 8px 22px}
  .task-body ul li{margin-bottom:4px}
  .task-body a{color:var(--primary);text-decoration:underline}

  /* ---------- SOLUTIONS ---------- */
  .solutions-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:24px 0 14px;
  }
  .solutions-head h2{font-size:18px;font-weight:700}
  .solution{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px 20px;
    margin-bottom:14px;
    position:relative;
  }
  .solution.best{
    border:2px solid var(--primary);
    background:linear-gradient(180deg,#fff 0%,#F0FDF4 100%);
  }
  .solution.best::before{
    content:"✓ Лучшее решение";
    position:absolute;top:-11px;left:16px;
    background:var(--primary);color:#fff;
    padding:3px 10px;border-radius:999px;
    font-size:12px;font-weight:700;
  }
  .solution-head{
    display:flex;align-items:center;gap:10px;margin-bottom:10px;
  }
  .solution-author{font-weight:600;font-size:14px}
  .solution-meta{font-size:12px;color:var(--text-muted)}
  .solution-body{margin:10px 0}
  .solution-actions{
    display:flex;gap:8px;margin-top:10px;padding-top:10px;
    border-top:1px dashed var(--border);
  }

  /* ---------- EDITOR ---------- */
  .editor-wrap{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;
    margin-top:16px;
  }
  .editor-toolbar{
    display:flex;gap:4px;padding:8px 10px;
    background:var(--bg-soft);border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .tool-btn{
    padding:6px 10px;border-radius:6px;
    font-size:13px;color:var(--text);
    background:var(--bg);border:1px solid var(--border);
    transition:all .15s;
  }
  .tool-btn:hover{background:var(--primary-light);color:var(--primary-dark);border-color:var(--primary)}
  .editor-tabs{
    display:flex;margin-left:auto;gap:4px;
  }
  .editor-tab{
    padding:6px 12px;border-radius:6px;
    font-size:13px;color:var(--text-muted);cursor:pointer;
  }
  .editor-tab.active{background:var(--primary);color:#fff}
  .editor-area{
    width:100%;min-height:160px;padding:14px;
    border:none;outline:none;resize:vertical;
    font-family:inherit;font-size:14px;line-height:1.6;
    background:var(--bg);
  }
  .preview-area{
    padding:14px;min-height:160px;
    background:var(--bg);font-size:14px;line-height:1.7;
  }
  .editor-footer{
    padding:10px 14px;background:var(--bg-soft);
    border-top:1px solid var(--border);
    display:flex;justify-content:flex-end;gap:8px;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{display:flex;flex-direction:column;gap:16px}
  .side-card{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;
  }
  .side-card h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text)}
  .side-item{
    padding:8px 0;border-bottom:1px dashed var(--border);
    font-size:13px;
  }
  .side-item:last-child{border-bottom:none}
  .side-item .lbl{color:var(--text-muted);display:block;font-size:12px;margin-bottom:2px}
  .side-item .val{font-weight:600;color:var(--text)}

  /* ---------- PROFILE ---------- */
  .profile-head{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:24px;
    display:flex;gap:20px;align-items:center;
    margin-bottom:20px;
  }
  .profile-info h2{font-size:22px;font-weight:700;margin-bottom:4px}
  .profile-info .role{
    display:inline-block;padding:3px 10px;border-radius:999px;
    background:var(--primary-light);color:var(--primary-dark);
    font-size:12px;font-weight:600;margin-bottom:8px;
  }
  .profile-info .role.org{background:var(--accent-light);color:var(--accent)}
  .profile-info .meta{font-size:13px;color:var(--text-muted)}
  .profile-stats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
    margin-top:12px;
  }
  .stat{
    background:var(--bg-soft);border-radius:10px;padding:10px 12px;
    text-align:center;
  }
  .stat .n{font-size:20px;font-weight:700;color:var(--primary)}
  .stat .l{font-size:12px;color:var(--text-muted)}

  .tabs{
    display:flex;gap:4px;border-bottom:1px solid var(--border);
    margin-bottom:20px;
  }
  .tab{
    padding:10px 16px;font-size:14px;font-weight:500;
    color:var(--text-muted);cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:all .15s;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--primary);border-color:var(--primary)}

  /* ---------- NOTES ---------- */
  .note{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;margin-bottom:10px;
  }
  .note-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:6px;
  }
  .note-title{font-weight:600;font-size:14px}
  .note-linked{
    font-size:11px;color:var(--accent);
    background:var(--accent-light);padding:2px 8px;border-radius:999px;
  }
  .note-body{font-size:13px;color:var(--text-muted);white-space:pre-wrap}
  .note-actions{display:flex;gap:6px;margin-top:8px}

  /* ---------- NOTES PANEL (slide) ---------- */
  .notes-panel{
    position:fixed;top:0;right:0;bottom:0;
    width:380px;max-width:100vw;
    background:var(--bg);border-left:1px solid var(--border);
    box-shadow:var(--shadow-lg);
    transform:translateX(100%);transition:transform .25s;
    z-index:100;display:flex;flex-direction:column;
  }
  .notes-panel.open{transform:translateX(0)}
  .notes-panel-head{
    padding:16px 18px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .notes-panel-head h3{font-size:16px;font-weight:700}
  .notes-panel-body{flex:1;overflow-y:auto;padding:14px}
  .close-x{
    width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-soft);
  }
  .close-x:hover{background:var(--bg-soft-2)}

  /* ---------- COMMUNITY ---------- */
  .search-bar{
    display:flex;gap:10px;margin-bottom:16px;
  }
  .search-input{
    flex:1;padding:10px 14px;border:1px solid var(--border);
    border-radius:8px;background:var(--bg);outline:none;
    font-size:14px;
  }
  .search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
  .people-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;
  }
  .person-card{
    background:var(--bg);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px;
    transition:all .2s;
  }
  .person-card:hover{border-color:var(--primary);box-shadow:var(--shadow)}
  .person-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
  .person-name{font-weight:600;font-size:15px}
  .person-role{font-size:12px;color:var(--text-muted)}
  .person-meta{font-size:13px;color:var(--text-muted);margin-top:4px}

  /* ---------- MODAL ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.5);
    z-index:200;display:none;align-items:center;justify-content:center;
    padding:20px;
  }
  .modal-backdrop.open{display:flex}
  .modal{
    background:var(--bg);border-radius:var(--radius);
    padding:24px;max-width:520px;width:100%;
    max-height:90vh;overflow-y:auto;
  }
  .modal h3{font-size:18px;font-weight:700;margin-bottom:14px}
  .form-group{margin-bottom:14px}
  .form-group label{
    display:block;font-size:13px;font-weight:600;
    color:var(--text);margin-bottom:6px;
  }
  .form-group input,.form-group select,.form-group textarea{
    width:100%;padding:9px 12px;
    border:1px solid var(--border);border-radius:8px;
    background:var(--bg);outline:none;font-size:14px;
  }
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
    border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);
  }

  /* ---------- EMPTY ---------- */
  .empty{
    text-align:center;padding:40px 20px;color:var(--text-muted);
    background:var(--bg);border:1px dashed var(--border);border-radius:var(--radius);
  }
  .empty-icon{font-size:36px;margin-bottom:8px;opacity:.5}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;
    padding:10px 18px;border-radius:999px;
    font-size:14px;font-weight:500;
    z-index:300;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;
    box-shadow:var(--shadow-lg);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:860px){
    .cat-bar{grid-template-columns:repeat(2,1fr)}
    .nav{display:none}
    .profile-stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

/* ============================================================

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function parseBB(text){
  let s = escapeHtml(text);

  // code (protect from further processing)
  const codeBlocks = [];
  s = s.replace(/\[code\]([\s\S]*?)\[\/code\]/gi, (m,c)=>{
    codeBlocks.push('<code>'+c+'</code>');
    return '%%CODE'+(codeBlocks.length-1)+'%%';
  });

  // bold, italic, underline
  s = s.replace(/\[b\]([\s\S]*?)\[\/b\]/gi,'<strong>$1</strong>');
  s = s.replace(/\[i\]([\s\S]*?)\[\/i\]/gi,'<em>$1</em>');
  s = s.replace(/\[u\]([\s\S]*?)\[\/u\]/gi,'<u>$1</u>');
  s = s.replace(/\[sub\]([\s\S]*?)\[\/sub\]/gi,'<sub>$1</sub>');
  s = s.replace(/\[sup\]([\s\S]*?)\[\/sup\]/gi,'<sup>$1</sup>');

  // quote
  s = s.replace(/\[quote\]([\s\S]*?)\[\/quote\]/gi,'<blockquote>$1</blockquote>');

  // url
  s = s.replace(/\[url=(.*?)\](.*?)\[\/url\]/gi,'<a href="$1" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\[url\](.*?)\[\/url\]/gi,'<a href="$1" target="_blank" rel="noopener">$1</a>');

  // list
  s = s.replace(/\[list\]([\s\S]*?)\[\/list\]/gi,(m,inner)=>{
    const items = inner.split(/\[\*\]/).filter(x=>x.trim().length>0);
    return '<ul>'+items.map(it=>'<li>'+it.replace(/\n$/,'')+'</li>').join('')+'</ul>';
  });

  // paragraphs: split by double newline
  s = s.split(/\n{2,}/).map(p=>{
    p = p.trim();
    if(!p) return '';
    if(/^<(ul|blockquote|pre|code|h\d)/.test(p)) return p;
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');

  // restore code
  s = s.replace(/%%CODE(\d+)%%/g,(m,i)=>codeBlocks[+i]);

  return s;
}

/* ============================================================
   EDITOR
============================================================ */
function renderEditor(id, initialText=''){
  STATE._editors = STATE._editors||{};
  if(!STATE._editors[id]) STATE._editors[id] = {text:initialText,mode:'edit'};
  const ed = STATE._editors[id];

  const tools = [
    {label:'Жирный', code:'b', tip:'Выделить жирным [b]...[/b]'},
    {label:'Курсив', code:'i', tip:'Выделить курсивом [i]...[/i]'},
    {label:'Подчёркнутый', code:'u', tip:'Подчёркивание [u]...[/u]'},
    {label:'Нижний индекс', code:'sub', tip:'Для формул: H[sub]2[/sub]O'},
    {label:'Верхний индекс', code:'sup', tip:'Для степеней и ионов: Ca[sup]2+[/sup]'},
    {label:'Цитата', code:'quote', tip:'Блок цитаты [quote]...[/quote]'},
    {label:'Код / ДНК', code:'code', tip:'Моноширинный текст для последовательностей'},
    {label:'Список', code:'list', tip:'Маркированный список [list][*]пункт[/list]'},
    {label:'Ссылка', code:'url', tip:'Ссылка [url=...]текст[/url]'}
  ];

  return `
    <div class="editor-toolbar">
      ${tools.map(t=>`<button class="tool-btn" title="${t.tip}" onclick="insertBB('${id}','${t.code}')">${t.label}</button>`).join('')}
      <div class="editor-tabs">
        <div class="editor-tab ${ed.mode==='edit'?'active':''}" onclick="setEditorMode('${id}','edit')">Редактор</div>
        <div class="editor-tab ${ed.mode==='preview'?'active':''}" onclick="setEditorMode('${id}','preview')">Предпросмотр</div>
      </div>
    </div>
    ${ed.mode==='edit'
      ? `<textarea class="editor-area" id="ta_${id}" oninput="STATE._editors['${id}'].text=this.value" placeholder="Введите текст, используя BB-коды...">${escapeHtml(ed.text)}</textarea>`
      : `<div class="preview-area task-body">${parseBB(ed.text)||'<span style="color:var(--text-muted)">Пустой предпросмотр</span>'}</div>`
    }
  `;
}

function setEditorMode(id,mode){
  // save current text first
  const ta = document.getElementById('ta_'+id);
  if(ta) STATE._editors[id].text = ta.value;
  STATE._editors[id].mode = mode;
  render();
}

function insertBB(id,code){
  const ta = document.getElementById('ta_'+id);
  if(!ta){
    // preview mode - switch to edit
    STATE._editors[id].mode='edit';
    render();
    setTimeout(()=>insertBB(id,code),50);
    return;
  }
  const start = ta.selectionStart, end = ta.selectionEnd;
  const val = ta.value;
  const selected = val.substring(start,end);
  let insert;
  if(code==='list'){
    insert = '[list]\n[*]'+(selected||'пункт 1')+'\n[*]пункт 2\n[/list]';
  } else if(code==='url'){
    insert = '[url=https://example.com]'+(selected||'текст ссылки')+'[/url]';
  } else {
    insert = '['+code+']'+(selected||'')+'[/'+code+']';
  }
  ta.value = val.substring(0,start)+insert+val.substring(end);
  STATE._editors[id].text = ta.value;
  ta.focus();
  const newPos = start+insert.length;
  ta.setSelectionRange(newPos,newPos);
}

function getEditorText(id){
  const ta = document.getElementById('ta_'+id);
  if(ta) return ta.value;
  return STATE._editors[id]?.text||'';
}

  STATE.notes = STATE.notes.filter(n=>n.id!==id);

  render();

  const n = STATE.notes.find(x=>x.id===id);
  const choices = STATE.tasks.map((t,i)=>`${i+1}. ${t.title}`).join('\n');

  const idx = parseInt(sel)-1;
  if(isNaN(idx)||!STATE.tasks[idx]){toast('Неверный номер');return}
  n.linkedTask = STATE.tasks[idx].id;
  toast('✓ Заметка прикреплена');
  render();
}

function renderActivityTab(){
  const u = currentUser();
  const mySolutions = [];
  STATE.tasks.forEach(t=>{
    t.solutionsList.forEach(s=>{
      if(s.authorId===u.id) mySolutions.push({task:t,sol:s});
    });
  });
  const myTasks = STATE.tasks.filter(t=>t.authorId===u.id);

  return `
    <h3 style="margin-bottom:12px;font-size:16px">💡 Мои решения (${mySolutions.length})</h3>
    ${mySolutions.length===0?`
      <div class="empty" style="margin-bottom:20px">
        <div class="empty-icon">🌱</div>
        <div>Вы пока не предлагали решений</div>
      </div>
    `:mySolutions.map(({task,sol})=>`
      <div class="solution ${sol.best?'best':''}" style="cursor:pointer" onclick="openTask('${task.id}')">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">
          Задача: <strong style="color:var(--text)">${escapeHtml(task.title)}</strong> · ${sol.date}
        </div>
        <div class="task-body" style="font-size:14px">${parseBB(sol.body.substring(0,200))}${sol.body.length>200?'…':''}</div>
      </div>
    `).join('')}

    <h3 style="margin:24px 0 12px;font-size:16px">📝 Мои задачи (${myTasks.length})</h3>
    ${myTasks.length===0?`
      <div class="empty">
        <div class="empty-icon">📭</div>
        <div>Вы пока не публиковали задач</div>
      </div>
    `:myTasks.map(t=>`
      <div class="task-card" onclick="openTask('${t.id}')">
        <div class="task-top">${catTag(t.cat)} ${levelTag(t.level)} ${statusTag(t.status)}</div>
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-meta">
          <span>📅 ${t.date}</span>
          <span>💬 ${t.solutionsList.length} решений</span>
        </div>
      </div>
    `).join('')}
  `;
}

/* ============================================================
   NOTES PANEL
============================================================ */
function toggleNotes(open){
  const p = $('#notesPanel');
  if(open===undefined) open = !p.classList.contains('open');
  p.classList.toggle('open',open);
  if(open) renderNotesPanel();
}

function renderNotesPanel(){
  const body = $('#notesPanelBody');
  const currentTaskId = STATE.currentTaskId;
  const linked = STATE.notes.filter(n=>n.linkedTask===currentTaskId);
  const other = STATE.notes.filter(n=>n.linkedTask!==currentTaskId);

  body.innerHTML = `
    <button class="btn btn-primary btn-sm" style="width:100%;margin-bottom:12px" onclick="addNote()">+ Новая заметка</button>

    ${currentTaskId?`
      <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px">Прикреплены к этой задаче</div>
      ${linked.length===0?`<div style="font-size:13px;color:var(--text-muted);padding:6px 0">Пока нет заметок по этой задаче</div>`:''}
      ${linked.map(n=>noteCardHTML(n)).join('')}
    `:''}

    <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px">Все заметки</div>
    ${STATE.notes.length===0?`<div style="font-size:13px;color:var(--text-muted);padding:6px 0">Заметок пока нет</div>`:''}
    ${STATE.notes.map(n=>noteCardHTML(n)).join('')}
  `;
}

function noteCardHTML(n){
  const t = n.linkedTask?STATE.tasks.find(x=>x.id===n.linkedTask):null;
  return `
    <div class="note">
      <div class="note-head">
        <div class="note-title">${escapeHtml(n.title||'Без названия')}</div>
        ${t?`<span class="note-linked">📎</span>`:''}
      </div>
      <div class="note-body">${escapeHtml(n.body)}</div>
      <div class="note-actions">
        <button class="btn btn-ghost btn-sm" onclick="editNote('${n.id}')">✎</button>
        ${STATE.currentTaskId && n.linkedTask!==STATE.currentTaskId?`<button class="btn btn-ghost btn-sm" onclick="quickLinkNote('${n.id}')">📎 К этой задаче</button>`:''}
        ${n.linkedTask && n.linkedTask!==STATE.currentTaskId?`<button class="btn btn-ghost btn-sm" onclick="unlinkNote('${n.id}')">✂ Открепить</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="deleteNote('${n.id}')" style="color:var(--danger)">🗑</button>
      </div>
    </div>
  `;
}

function quickLinkNote(id){
  const n = STATE.notes.find(x=>x.id===id);
  n.linkedTask = STATE.currentTaskId;
  toast('✓ Заметка прикреплена');
  renderNotesPanel();
}

function unlinkNote(id){
  const n = STATE.notes.find(x=>x.id===id);
  n.linkedTask = null;
  toast('Заметка откреплена');
  renderNotesPanel();
}

/* ============================================================
   COMMUNITY
============================================================ */
function renderCommunity(){
  const q = STATE.searchQuery.toLowerCase().trim();
  const role = STATE.searchRole;

  let people = Object.values(USERS);
  if(role!=='all') people = people.filter(u=>u.role===role);
  if(q) people = people.filter(u=>
    u.name.toLowerCase().includes(q)||
    (u.uni||'').toLowerCase().includes(q)||
    (u.spec||'').toLowerCase().includes(q)
  );

  return `
    <h1 class="page-title">Сообщество</h1>
    <p class="page-sub">Находите единомышленников, экспертов и потенциальных работодателей</p>

    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="🔍 Поиск по имени, ВУЗу или специализации…" value="${escapeHtml(STATE.searchQuery)}" oninput="updateSearch(this.value)">
    </div>

    <div class="filters-row" style="margin-bottom:20px">
      <span class="filters-label">Кого ищем:</span>
      ${['all','student','org','admin'].map(r=>`
        <span class="chip ${STATE.searchRole===r?'active':''}" onclick="setSearchRole('${r}')">
          ${r==='all'?'Все':r==='student'?'Студенты':r==='org'?'Организации':'Администраторы'}
        </span>
      `).join('')}
    </div>

    <div class="people-grid">
      ${people.length===0?`
        <div class="empty" style="grid-column:1/-1">
          <div class="empty-icon">🔍</div>
          <div>Никого не найдено</div>
        </div>
      `:people.map(u=>{
        const isOrg = u.role==='org';
        return `
        <div class="person-card">
          <div class="person-top">
            ${avatarHTML(u,'md')}
            <div>
              <div class="person-name">${escapeHtml(u.name)}</div>
              <div class="person-role">
                <span class="role ${isOrg?'org':''}" style="font-size:11px;padding:2px 8px">${roleLabel(u.role)}</span>
              </div>
            </div>
          </div>
          <div class="person-meta">🏛 ${escapeHtml(u.uni||'—')}</div>
          <div class="person-meta">🔬 ${escapeHtml(u.spec||'—')}</div>
          <div class="person-meta" style="margin-top:6px">
            <span class="tag status-open" style="font-size:11px">● ${escapeHtml(u.status||'—')}</span>
          </div>
          ${u.role==='student'?`
            <div style="display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;color:var(--text-muted)">
              <span><b style="color:var(--primary)">${u.solved}</b> решено</span>
              <span><b style="color:var(--primary)">${u.best}</b> лучших</span>
            </div>
          `:''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function updateSearch(v){STATE.searchQuery=v;render();setTimeout(()=>{const i=$('#searchInput');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},0)}
function setSearchRole(r){STATE.searchRole=r;render()}

/* ============================================================
   LOGIN
============================================================ */
function renderLoginList(){
  const host = $('#loginList');
  if(!host) return;
  host.innerHTML = Object.values(USERS).map(u=>`
    <div style="display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s" 
         onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'"
         onclick="switchUser('${u.id}')">
      ${avatarHTML(u)}
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px">${escapeHtml(u.name)} ${STATE.currentUserId===u.id?'<span style="color:var(--primary);font-size:11px">· текущий</span>':''}</div>
        <div style="font-size:12px;color:var(--text-muted)">${roleLabel(u.role)} · ${escapeHtml(u.uni||'')}</div>
      </div>
    </div>
  `).join('');
}

function switchUser(id){
  STATE.currentUserId = id;
  closeModal('loginModal');
  renderUserChip();
  toast('✓ Профиль изменён: '+USERS[id].name);
  render();
}

/* ============================================================
   MAIN RENDER
============================================================ */
function render(){
  const app = $('#app');
  let html = '';
  if(STATE.view==='home') html = renderHome();
  else if(STATE.view==='task') html = renderTaskPage();
  else if(STATE.view==='profile') html = renderProfile();
  else if(STATE.view==='community') html = renderCommunity();
  app.innerHTML = html;

  // nav active
  $$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===STATE.view||(STATE.view==='task'&&b.dataset.view==='home')));

  // post-render hooks
  if(STATE.view==='task' && $('#nt_editor')) renderNewTaskEditor();
  if($('#loginList')) renderLoginList();
  if($('#notesPanel').classList.contains('open')) renderNotesPanel();
}

/* ============================================================
   INIT
============================================================ */
document.addEventListener('click',(e)=>{
  // close modal on backdrop click
  if(e.target.classList.contains('modal-backdrop')){
    e.target.classList.remove('open');
  }
});

renderUserChip();
render();
</script>
</body>
</html>
