<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioCase — научный форум и платформа биологических кейсов</title>
<style>
/* ============================================================
   БАЗА
   ============================================================ */
:root{
  --white:#FFFFFF;
  --mint:#F4F9F6;
  --green:#15803D;
  --green-600:#16A34A;
  --green-050:#DCFCE7;
  --green-100:#BBF7D0;
  --teal:#0D9488;
  --teal-050:#CCFBF1;
  --dark:#1E293B;
  --slate-600:#475569;
  --slate-500:#64748B;
  --slate-400:#94A3B8;
  --border:#E2E8F0;
  --border-soft:#EDF2EF;
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:8px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.06), 0 14px 34px -18px rgba(21,128,61,.22);
  --shadow-lg:0 24px 60px -24px rgba(16,24,40,.25);
  --header-h:66px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--white);
  color:var(--dark);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block}
::selection{background:var(--green-100);color:var(--green)}
.muted{color:var(--slate-500)}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

/* ============================================================
   ШАПКА
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1180px;margin:0 auto;padding:0 24px;
  height:var(--header-h);
  display:flex;align-items:center;gap:26px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.4px}
.logo svg{width:28px;height:28px;color:var(--green)}
.logo .accent{color:var(--green)}
.main-nav{display:flex;gap:4px;margin-left:8px}
.main-nav a{
  padding:8px 14px;border-radius:999px;font-size:14.5px;font-weight:550;color:var(--slate-600);
  transition:.16s;
}
.main-nav a:hover{background:var(--mint);color:var(--green)}
.main-nav a.active{background:var(--green-050);color:var(--green)}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px}

.admin-toggle{
  display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--slate-500);
  background:var(--mint);border:1px solid var(--border-soft);
  padding:6px 11px;border-radius:999px;cursor:pointer;user-select:none;transition:.16s;
}
.admin-toggle:hover{border-color:var(--green-100)}
.admin-toggle .dot{
  width:9px;height:9px;border-radius:50%;background:var(--slate-400);transition:.16s;
}
.admin-toggle.on{background:var(--green-050);border-color:var(--green-100);color:var(--green);font-weight:600}
.admin-toggle.on .dot{background:var(--green);box-shadow:0 0 0 3px rgba(21,128,61,.15)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:var(--radius-sm);
  font-size:14.5px;font-weight:600;transition:.16s;white-space:nowrap;
}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 2px 8px -2px rgba(21,128,61,.5)}
.btn-primary:hover{background:#0F6A32;transform:translateY(-1px)}
.btn-ghost{background:var(--white);border:1px solid var(--border);color:var(--slate-600)}
.btn-ghost:hover{border-color:var(--green-100);color:var(--green);background:var(--mint)}
.btn-soft{background:var(--mint);color:var(--green);border:1px solid var(--border-soft)}
.btn-soft:hover{background:var(--green-050)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.avatar{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(140deg,#15803D,#0D9488);color:#fff;
  font-weight:700;font-size:13.5px;letter-spacing:.3px;flex:none;
}
.avatar.lg{width:76px;height:76px;font-size:24px}
.avatar.sm{width:30px;height:30px;font-size:11.5px}
.avatar.org{background:linear-gradient(140deg,#0D9488,#0F766E)}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--border);transition:.16s;cursor:pointer}
.user-chip:hover{border-color:var(--green-100);background:var(--mint)}
.user-chip-name{font-size:13.5px;font-weight:600;line-height:1.2}
.user-chip-role{font-size:11.5px;color:var(--slate-500);line-height:1.2}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(170deg,#FFFFFF 0%,var(--mint) 100%);
  border-bottom:1px solid var(--border-soft);
}
.hero-pattern{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-inner{position:relative;padding:54px 0 46px}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--white);border:1px solid var(--green-100);
  color:var(--green);font-size:12.5px;font-weight:600;
  padding:6px 13px;border-radius:999px;margin-bottom:20px;
  box-shadow:var(--shadow-sm);
}
.hero-badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.hero h1{
  font-size:clamp(28px,4vw,44px);line-height:1.12;letter-spacing:-1.2px;
  font-weight:760;max-width:720px;margin-bottom:16px;
}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{max-width:620px;color:var(--slate-600);font-size:16.5px;margin-bottom:26px}
.hero-stats{display:flex;flex-wrap:wrap;gap:14px}
.hero-stat{
  background:var(--white);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  padding:12px 20px;box-shadow:var(--shadow-sm);
}
.hero-stat b{display:block;font-size:22px;font-weight:740;color:var(--green);line-height:1.1}
.hero-stat span{font-size:12.5px;color:var(--slate-500)}

/* ============================================================
   КАТЕГОРИИ
   ============================================================ */
.section{padding:38px 0}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.section-head h2{font-size:21px;font-weight:720;letter-spacing:-.4px}
.section-head p{font-size:14px;color:var(--slate-500);margin-top:2px}

.cat-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:13px;
}
.cat-card{
  position:relative;text-align:left;
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 16px 16px;transition:.18s;overflow:hidden;
}
.cat-card::after{
  content:'';position:absolute;inset:0;border-radius:var(--radius);
  background:linear-gradient(160deg,rgba(21,128,61,.06),transparent 60%);
  opacity:0;transition:.18s;
}
.cat-card:hover{border-color:var(--green-100);transform:translateY(-3px);box-shadow:var(--shadow)}
.cat-card:hover::after{opacity:1}
.cat-card.active{border-color:var(--green);background:var(--green-050);box-shadow:0 0 0 1px var(--green) inset}
.cat-card.active .cat-icon{background:var(--green);color:#fff}
.cat-icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:var(--mint);color:var(--green);margin-bottom:12px;transition:.18s;
}
.cat-icon svg{width:21px;height:21px}
.cat-name{display:block;font-size:13.8px;font-weight:650;line-height:1.3;letter-spacing:-.15px}
.cat-count{display:block;font-size:12px;color:var(--slate-500);margin-top:4px}
.cat-card.active .cat-count{color:var(--green);font-weight:600}

/* ============================================================
   ФИЛЬТРЫ / ИНФО
   ============================================================ */
.filter-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 0 4px;
}
.filter-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-label{font-size:12.5px;color:var(--slate-400);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.chip{
  padding:6px 13px;border-radius:999px;font-size:13px;font-weight:550;
  background:var(--white);border:1px solid var(--border);color:var(--slate-600);transition:.15s;
}
.chip:hover{border-color:var(--green-100);color:var(--green)}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.chip.active-teal{background:var(--teal);border-color:var(--teal);color:#fff}

.info-bar{
  margin-top:18px;padding:20px 22px;border-radius:var(--radius);
  background:linear-gradient(120deg,var(--mint),#FFFFFF 70%);
  border:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.info-bar h3{font-size:17px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.info-bar h3 svg{width:19px;height:19px;color:var(--green)}
.info-bar p{font-size:13.6px;color:var(--slate-600);margin-top:5px;max-width:640px}
.info-count{
  background:var(--white);border:1px solid var(--green-100);color:var(--green);
  padding:9px 17px;border-radius:999px;font-size:13.5px;font-weight:650;white-space:nowrap;
}

/* ============================================================
   КАРТОЧКА ЗАДАЧИ
   ============================================================ */
.task-list{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.task-card{
  display:block;background:var(--white);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 22px;transition:.18s;cursor:pointer;position:relative;
}
.task-card:hover{border-color:var(--green-100);box-shadow:var(--shadow);transform:translateY(-2px)}
.task-card:hover .task-title{color:var(--green)}
.task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.task-title{font-size:17px;font-weight:680;letter-spacing:-.3px;line-height:1.35;transition:.15s}
.task-excerpt{
  font-size:13.8px;color:var(--slate-500);margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.task-meta{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;
  padding-top:13px;border-top:1px dashed var(--border-soft);
  font-size:12.8px;color:var(--slate-500);
}
.task-meta .mi{display:flex;align-items:center;gap:6px}
.task-meta svg{width:14px;height:14px;color:var(--slate-400)}

/* теги */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:3.5px 10px;border-radius:999px;
  font-size:11.8px;font-weight:650;letter-spacing:.1px;white-space:nowrap;
}
.tag svg{width:12px;height:12px}
.tag-cat{background:var(--green-050);color:var(--green)}
.tag-org{background:var(--teal-050);color:#0F766E}
.tag-org::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--teal)}
.tag-base{background:var(--teal-050);color:#0F766E}
.tag-adv{background:#FEF3C7;color:#B45309}
.tag-rnd{background:#EDE9FE;color:#6D28D9}
.tag-best{background:var(--green);color:#fff}
.tag-open{background:var(--mint);color:var(--slate-500);border:1px solid var(--border)}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green-600);display:inline-block}
.status-dot.gray{background:var(--slate-400)}

.empty{
  text-align:center;padding:60px 20px;color:var(--slate-500);
  background:var(--mint);border-radius:var(--radius);border:1px dashed var(--border);
}
.empty svg{width:38px;height:38px;margin:0 auto 12px;color:var(--slate-400)}

/* ============================================================
   СТРАНИЦА ЗАДАЧИ
   ============================================================ */
.task-page{max-width:900px;margin:0 auto;padding:26px 24px 80px}
.back-link{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13.5px;font-weight:600;color:var(--slate-500);margin-bottom:18px;transition:.15s;
}
.back-link:hover{color:var(--green)}
.back-link svg{width:15px;height:15px}

.task-sticky{
  position:sticky;top:calc(var(--header-h) + 8px);z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 16px;margin-bottom:16px;box-shadow:var(--shadow-sm);
}
.task-sticky .tsb-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.task-sticky .tsb-right{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--slate-500)}

.task-article{
  background:var(--white);border:1px solid var(--border);
  border-left:3px solid var(--green);
  border-radius:var(--radius);padding:26px 30px;box-shadow:var(--shadow-sm);
}
.task-article h1{font-size:25px;line-height:1.25;letter-spacing:-.6px;font-weight:730;margin-bottom:14px}
.task-article .meta-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;
  padding-bottom:18px;border-bottom:1px solid var(--border-soft);
  font-size:13px;color:var(--slate-500);
}
.task-condition{margin-top:2px}

/* BB-контент */
.bb-content{font-size:15px;line-height:1.72;color:var(--dark)}
.bb-content p{margin:0 0 12px}
.bb-content strong{font-weight:720;color:#0F172A}
.bb-content em{font-style:italic}
.bb-content u{text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--green-600)}
.bb-content blockquote{
  margin:14px 0;padding:12px 18px;
  border-left:3px solid var(--teal);background:var(--mint);
  border-radius:0 var(--radius-xs) var(--radius-xs) 0;
  color:var(--slate-600);font-style:italic;
}
.bb-content ul{margin:12px 0 12px 4px;padding-left:20px}
.bb-content li{margin:5px 0;position:relative;list-style:none}
.bb-content li::before{
  content:'';position:absolute;left:-15px;top:9px;
  width:6px;height:6px;border-radius:50%;background:var(--green-600);
}
.bb-content pre.bb-code{
  margin:14px 0;padding:14px 16px;border-radius:var(--radius-xs);
  background:#0F172A;color:#E2E8F0;overflow-x:auto;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.6;
}
.bb-content pre.bb-code code{white-space:pre-wrap;word-break:break-word}
.bb-content sub,.bb-content sup{font-size:.72em}
.bb-content sup{vertical-align:super}
.bb-content sub{vertical-align:sub}
.bb-content a{color:var(--teal);text-decoration:underline;text-underline-offset:2px;font-weight:550}

/* ============================================================
   РЕШЕНИЯ
   ============================================================ */
.solutions-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:34px 0 16px;flex-wrap:wrap;
}
.solutions-head h2{font-size:19px;font-weight:720;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}
.counter-pill{
  background:var(--mint);color:var(--green);border:1px solid var(--border-soft);
  font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;
}
.solutions-list{display:flex;flex-direction:column;gap:14px}

.solution{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px;transition:.18s;position:relative;
}
.solution.best{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset, 0 10px 30px -20px rgba(21,128,61,.5);background:linear-gradient(180deg,#F7FDF9,#FFFFFF 30%)}
.solution-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.solution-author{font-size:14px;font-weight:680}
.solution-sub{font-size:12.3px;color:var(--slate-500)}
.solution-date{margin-left:auto;font-size:12.3px;color:var(--slate-400)}
.solution-best-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--green);color:#fff;font-size:11.5px;font-weight:700;
  padding:4px 11px;border-radius:999px;letter-spacing:.2px;
}
.solution-best-badge svg{width:13px;height:13px}
.solution-actions{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border-soft);display:flex;gap:10px;flex-wrap:wrap}

/* ============================================================
   РЕДАКТОР
   ============================================================ */
.editor{
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  background:var(--white);box-shadow:var(--shadow-sm);
}
.editor-toolbar{
  display:flex;flex-wrap:wrap;gap:4px;
  padding:9px 10px;background:var(--mint);border-bottom:1px solid var(--border-soft);
}
.bb-btn{
  padding:5px 10px;border-radius:7px;font-size:12.6px;font-weight:600;
  color:var(--slate-600);background:var(--white);border:1px solid var(--border);
  transition:.14s;
}
.bb-btn:hover{background:var(--green-050);border-color:var(--green-100);color:var(--green)}
.bb-btn:active{transform:scale(.96)}
.editor-tabs{display:flex;gap:2px;padding:8px 10px 0;background:var(--white);border-bottom:1px solid var(--border-soft)}
.editor-tab{
  padding:7px 15px;border-radius:8px 8px 0 0;font-size:13px;font-weight:600;color:var(--slate-500);
  border:1px solid transparent;border-bottom:none;transition:.14s;
}
.editor-tab:hover{color:var(--green)}
.editor-tab.active{background:var(--white);color:var(--green);border-color:var(--border);border-bottom:1px solid var(--white);margin-bottom:-1px}
.editor-textarea{
  width:100%;min-height:170px;padding:16px 18px;border:none;outline:none;resize:vertical;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13.5px;line-height:1.65;background:var(--white);color:var(--dark);
}
.editor-textarea::placeholder{color:var(--slate-400)}
.editor-preview{padding:16px 18px;min-height:170px;background:var(--white)}
.editor-footer{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:12px 16px;background:var(--mint);border-top:1px solid var(--border-soft);
  font-size:12.5px;color:var(--slate-500);
}

/* ============================================================
   ПРОФИЛЬ
   ============================================================ */
.profile-page{padding:34px 0 80px}
.profile-head{
  display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  background:linear-gradient(135deg,var(--mint),#FFFFFF 65%);
  border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:26px 28px;margin-bottom:24px;
}
.profile-id h1{font-size:24px;font-weight:740;letter-spacing:-.6px}
.profile-id .role-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:13.5px;color:var(--slate-600)}
.profile-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.profile-stats{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
.pstat b{display:block;font-size:24px;font-weight:750;color:var(--green);line-height:1.1}
.pstat span{font-size:12.3px;color:var(--slate-500)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.tab{
  padding:11px 18px;font-size:14px;font-weight:600;color:var(--slate-500);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;border-radius:8px 8px 0 0;
}
.tab:hover{color:var(--green);background:var(--mint)}
.tab.active{color:var(--green);border-bottom-color:var(--green)}

.panel{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 26px;
}
.panel + .panel{margin-top:16px}
.panel h3{font-size:16px;font-weight:700;margin-bottom:14px;letter-spacing:-.25px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:11px 18px;font-size:14px}
.kv dt{color:var(--slate-500);font-size:13.5px}
.kv dd{font-weight:550}
@media(max-width:640px){.kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:11px}}

/* заметки */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.note-card{
  background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px 17px;transition:.16s;display:flex;flex-direction:column;
}
.note-card:hover{border-color:var(--green-100);box-shadow:var(--shadow-sm)}

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ---------- Собственный BB-код парсер ---------- */
function bbToHtml(text){
  if(!text) return '';
  let s = esc(text);

  // 1. Код извлекаем первым, чтобы внутри него не парсились теги
  const codeBlocks = [];
  s = s.replace(/\[code\]([\s\S]*?)\[\/code\]/gi, function(_, inner){
    codeBlocks.push(inner);
    return '\u0000CODE' + (codeBlocks.length - 1) + '\u0000';
  });

  // 2. Инлайн-теги
  s = s.replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>');
  s = s.replace(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>');
  s = s.replace(/\[u\]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>');
  s = s.replace(/\[sub\]([\s\S]*?)\[\/sub\]/gi, '<sub>$1</sub>');
  s = s.replace(/\[sup\]([\s\S]*?)\[\/sup\]/gi, '<sup>$1</sup>');
  s = s.replace(/\[quote\]([\s\S]*?)\[\/quote\]/gi, '<blockquote>$1</blockquote>');
  s = s.replace(/\[url=([^\]]+)\]([\s\S]*?)\[\/url\]/gi,
                '<a href="$1" target="_blank" rel="noopener noreferrer">$2</a>');

  // 3. Списки
  s = s.replace(/\[list\]([\s\S]*?)\[\/list\]/gi, function(_, inner){
    const items = inner.split(/\[\*\]/).map(function(x){ return x.trim(); })
                       .filter(function(x){ return x !== ''; })
                       .map(function(x){ return '<li>' + x.replace(/\r?\n/g,' ') + '</li>'; })
                       .join('');
    return '<ul>' + items + '</ul>';
  });

  // 4. Переводы строк
  s = s.replace(/\r?\n/g, '<br>');

  // 5. Возвращаем блоки кода
  s = s.replace(/\u0000CODE(\d+)\u0000/g, function(_, i){
    return '<pre class="bb-code"><code>' + codeBlocks[+i] + '</code></pre>';
  });

  return s;
}

function stripBb(text){
  return String(text).replace(/\[\/?[^\]]*\]/g, ' ').replace(/\s+/g, ' ').trim();
}

function fmtDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
}

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

    value = value || '';
    return `
    <div class="editor" data-editor="${prefix}">
      <div class="editor-toolbar">
        ${BB_BUTTONS.map(function(b){
          return `<button type="button" class="bb-btn" data-bb="${b.tag}" title="${esc(b.title)}">${esc(b.label)}</button>`;
        }).join('')}
      </div>
      <div class="editor-tabs">
        <button type="button" class="editor-tab active" data-tab="edit">Редактор</button>
        <button type="button" class="editor-tab" data-tab="preview">Как будет выглядеть</button>
      </div>
      <textarea class="editor-textarea" data-role="editor-input" placeholder="${esc(placeholder)}">${esc(value)}</textarea>
      <div class="editor-preview bb-content" data-role="editor-preview" style="display:none">${bbToHtml(value)}</div>
      <div class="editor-footer">
        <span>BB-коды: [b] [i] [u] [sub] [sup] [quote] [code] [list] [url]</span>
      </div>
    </div>`;
  }

  function handleBbBtn(btn){
    const editor = btn.closest('.editor');
    if(!editor) return;
    const ta = editor.querySelector('[data-role="editor-input"]');
    if(!ta) return;

    const tag = btn.dataset.bb;
    const cfg = BB_CONFIG[tag];
    if(!cfg) return;

    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const sel = ta.value.slice(start, end);
    const before = ta.value.slice(0, start);
    const after = ta.value.slice(end);

    // Список с несколькими строками — каждая строка становится пунктом
    if(tag === 'list' && sel.indexOf('\n') !== -1){
      const items = sel.split('\n').map(function(l){ return '[*]' + l; }).join('\n');
      ta.value = before + '[list]\n' + items + '\n[/list]' + after;
      ta.focus();
      const pos = before.length + '[list]\n'.length + items.length + '\n[/list]'.length;
      ta.setSelectionRange(pos, pos);
      return;
    }

    // URL: ставим курсор сразу после "="
    if(tag === 'url'){
      const text = sel || 'текст ссылки';
      const insert = '[url=]' + text + '[/url]';
      ta.value = before + insert + after;
      ta.focus();
      const pos = start + '[url='.length;
      ta.setSelectionRange(pos, pos);
      return;
    }

    const open = cfg[0], close = cfg[1], placeholder = cfg[2];
    const text = sel || placeholder;
    ta.value = before + open + text + close + after;
    ta.focus();

    if(sel){
      const pos = start + open.length + text.length + close.length;
      ta.setSelectionRange(pos, pos);
    } else {
      ta.setSelectionRange(start + open.length, start + open.length + placeholder.length);
    }
  }

  function handleEditorTab(tab){
    const editor = tab.closest('.editor');
    if(!editor) return;
    const name = tab.dataset.tab;

    editor.querySelectorAll('.editor-tab').forEach(function(t){
      t.classList.toggle('active', t.dataset.tab === name);
    });

    const ta = editor.querySelector('[data-role="editor-input"]');
    const preview = editor.querySelector('[data-role="editor-preview"]');

    if(name === 'preview'){
      preview.innerHTML = bbToHtml(ta.value);
      preview.style.display = 'block';
      ta.style.display = 'none';
    } else {
      preview.style.display = 'none';
      ta.style.display = 'block';
      ta.focus();
    }
  }

    const taskEl = document.getElementById('noteTask');
    if(!titleEl || !bodyEl) return;

    const title = titleEl.value.trim();
    const text = bodyEl.value.trim();
    const taskId = (taskEl && taskEl.value) || null;

    if(!title || !text){ toast('Заполните заголовок и текст заметки'); return; }

    if(state.editingNoteId === 'new'){
      notes.unshift({
        id: 'n' + Date.now(),
        userId: CURRENT_USER_ID,
        title: title,
        body: text,
        taskId: taskId,
        date: new Date().toISOString().slice(0,10)

    } else {
      const n = notes.find(function(x){ return x.id === state.editingNoteId; });
      if(n){ n.title = title; n.body = text; n.taskId = taskId; }
    }

    state.editingNoteId = null;
    renderNotesDrawer();
    toast('Заметка сохранена');

    if(location.hash === '#/profile') router();

      orgId: org ? org.id : 'o1',
      org: org ? org.name : 'Партнёр',
      authorId: CURRENT_USER_ID,
      date: new Date().toISOString().slice(0,10),
      body: body
    });

    const modal = document.getElementById('newTaskModal');
    if(modal) modal.remove();

    toast('Задача опубликована');

    if(location.hash !== '#/'){
      location.hash = '#/';
    } else {
      router();
    }
  }

  /* ============================================================
     11. ДЕЙСТВИЯ
     ============================================================ */
  function handleMarkBest(btn){
    const solId = btn.dataset.id;
    const taskId = btn.dataset.task;

    solutions.forEach(function(s){
      if(s.taskId === taskId) s.best = false;
    });
    const target = solutions.find(function(s){ return s.id === solId; });
    if(target) target.best = true;

    const t = tasks.find(function(x){ return x.id === taskId; });
    if(t) t.status = 'best';

    toast('Отмечено как лучшее решение');
    router();
  }

  function handlePublishSolution(btn){
    const taskId = btn.dataset.task;
    const editor = document.querySelector('.editor[data-editor="sol-' + taskId + '"]');
    if(!editor) return;
    const text = editor.querySelector('[data-role="editor-input"]').value.trim();
    if(!text){ toast('Введите текст решения'); return; }

    solutions.push({
      id: 's' + Date.now(),
      taskId: taskId,
      authorId: CURRENT_USER_ID,
      date: new Date().toISOString().slice(0,10),
      body: text,
      best: false
    });

    toast('Решение опубликовано');
    router();
  }

  function toggleAdmin(){
    state.isAdmin = !state.isAdmin;
    const btn = document.getElementById('adminToggle');
    btn.classList.toggle('on', state.isAdmin);
    document.getElementById('newTaskBtn').style.display = state.isAdmin ? '' : 'none';
    toast(state.isAdmin ? 'Режим администратора включён' : 'Режим администратора выключен');
    router();
  }

  function handleAction(action, el){
    switch(action){
      case 'set-cat':
        state.category = el.dataset.cat;
        router();
        break;

      case 'set-diff':
        state.difficulty = el.dataset.val;
        router();
        break;

      case 'set-status':
        state.status = el.dataset.val;
        router();
        break;

      case 'open-task':
        location.hash = '#/task/' + el.dataset.id;
        break;

      case 'mark-best':
        handleMarkBest(el);
        break;

      case 'publish-solution':
        handlePublishSolution(el);
        break;

      case 'open-notes':
        openNotes(el.dataset.task);
        break;

      case 'close-notes':
        closeNotes();
        break;

      case 'new-note':
        // Если ящик ещё не открыт — сбрасываем привязку к задаче
        if(!document.getElementById('drawer').classList.contains('open')){
          state.notesTaskFilter = null;
        }
        state.editingNoteId = 'new';
        document.getElementById('drawer').classList.add('open');
        document.getElementById('drawerOverlay').classList.add('open');
        renderNotesDrawer();
        break;

      case 'save-note':
        saveNote();
        break;

      case 'cancel-note':
        state.editingNoteId = null;
        renderNotesDrawer();
        break;

      case 'edit-note':
        state.editingNoteId = el.dataset.id;
        document.getElementById('drawer').classList.add('open');
        document.getElementById('drawerOverlay').classList.add('open');
        renderNotesDrawer();
        break;

      case 'delete-note':
        deleteNote(el.dataset.id);
        break;

      case 'profile-tab':
        state.profileTab = el.dataset.tab;
        router();
        break;

      case 'close-new-task': {
        const m = document.getElementById('newTaskModal');
        if(m) m.remove();
        break;
      }

      case 'publish-task':
        publishTask();
        break;

      case 'community-action':
        toast('Запрос к ' + el.dataset.name + ' отправлен (демо)');
        break;

      default:
        break;
    }
  }

  /* ============================================================
     12. РОУТЕР
     ============================================================ */
  function updateNav(hash){
    const nav = document.getElementById('mainNav');
    if(!nav) return;
    let key = 'home';
    if(hash.indexOf('#/community') === 0) key = 'community';
    else if(hash.indexOf('#/profile') === 0) key = 'profile';

    nav.querySelectorAll('a').forEach(function(a){
      a.classList.toggle('active', a.dataset.nav === key);
    });
  }

  function router(){
    const hash = location.hash || '#/';
    const app = document.getElementById('app');
    if(!app) return;

    if(hash.indexOf('#/task/') === 0){
      const id = hash.split('/')[2];
      app.innerHTML = renderTaskPage(id);
    } else if(hash === '#/community'){
      app.innerHTML = renderCommunity();
    } else if(hash === '#/profile'){
      app.innerHTML = renderProfile();
    } else {
      app.innerHTML = renderHome();
    }

    updateNav(hash);
  }

  /* ============================================================
     13. ГЛОБАЛЬНЫЕ ОБРАБОТЧИКИ
     ============================================================ */
  document.addEventListener('click', function(e){
    const actionEl = e.target.closest('[data-action]');
    if(actionEl){
      // ссылки с data-action="close-notes" не должны перехватываться до перехода
      if(actionEl.tagName === 'A' && actionEl.dataset.action === 'close-notes'){
        closeNotes();
        return;
      }
      handleAction(actionEl.dataset.action, actionEl);
    }

    const bbBtn = e.target.closest('.bb-btn');
    if(bbBtn){
      e.preventDefault();
      handleBbBtn(bbBtn);
    }

    const editorTab = e.target.closest('.editor-tab');
    if(editorTab){
      e.preventDefault();
      handleEditorTab(editorTab);
    }
  });

  document.addEventListener('input', function(e){
    if(e.target.id === 'communitySearch'){
      state.communityQuery = e.target.value;
      updatePeopleGrid();
    }
  });

  document.addEventListener('change', function(e){
    if(e.target.id === 'communityType'){
      state.communityType = e.target.value;
      updatePeopleGrid();
    }
    if(e.target.id === 'communityUni'){
      state.communityUni = e.target.value;
      updatePeopleGrid();
    }
    if(e.target.id === 'communitySpec'){
      state.communitySpec = e.target.value;
      updatePeopleGrid();
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      if(document.getElementById('drawer').classList.contains('open')) closeNotes();
      const m = document.getElementById('newTaskModal');
      if(m) m.remove();
    }
  });

  /* ============================================================
     14. ИНИЦИАЛИЗАЦИЯ
     ============================================================ */
  function init(){
    const u = me();
    const chip = document.getElementById('userChip');
    if(chip){
      chip.innerHTML = `
        <div class="avatar sm">${esc(u.avatar)}</div>
        <div>
          <div class="user-chip-name">${esc(u.name)}</div>
          <div class="user-chip-role">${esc(u.role)}</div>
        </div>`;
    }

    document.getElementById('adminToggle').addEventListener('click', toggleAdmin);
    document.getElementById('newTaskBtn').addEventListener('click', openNewTaskModal);
    document.getElementById('drawerOverlay').addEventListener('click', closeNotes);

    window.addEventListener('hashchange', router);

    if(!location.hash) location.hash = '#/';
    router();
  }

  init();
</script>
</body>
</html>
